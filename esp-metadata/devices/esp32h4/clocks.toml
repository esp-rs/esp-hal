system_clocks = { clock_tree = [
    # High-speed clock sources.
    { name = "XTAL_CLK",     type = "source",  values = "32",     output = "VALUE * 1_000_000", always_on = true },
    { name = "PLL_F96M_CLK", type = "derived", from = "XTAL_CLK", output = "96_000_000" },
    { name = "PLL_F48M_CLK", type = "generic",                    output = "PLL_F96M_CLK / 2" },

    # PCR.iomux_clk_conf.iomux_func_clk_sel: 0 = XTAL, 1 = RC_FAST, 2 = PLL_F48M. The IO MUX clock
    # is always running, which is also what keeps PLL_F48M_CLK (and with it the USB Serial/JTAG)
    # alive while no other peripheral asks for it.
    { name = "IOMUX_FUNCTION_CLOCK", type = "mux", always_on = true, variants = [
        { name = "XTAL_CLK",    outputs = "XTAL_CLK" },
        { name = "RC_FAST_CLK", outputs = "RC_FAST_CLK" },
        { name = "PLL_F48M",    outputs = "PLL_F48M_CLK", default = true },
    ] },

    { name = "XTAL_X2_CLK",  type = "derived", from = "XTAL_CLK", output = "64_000_000" },
    { name = "RC_FAST_CLK",  type = "source",                     output = "20_000_000" },

    # Low-speed clocks
    { name = "XTAL32K_CLK",    type = "source",  output = "32768", cfg = "use_xtal32k" },
    { name = "OSC_SLOW_CLK",   type = "source",  output = "32768" },
    { name = "RC_SLOW_CLK",    type = "source",  output = "600_000" },
    # Fixed divider, see rtc_clk_slow_freq_get_hz().
    { name = "RC_SLOW_D4_CLK", type = "generic", output = "RC_SLOW_CLK / 4" },

    # see soc_cpu_clk_src_t in clk_tree_defs.h.
    { name = "HP_ROOT_CLK", type = "mux", variants = [
        { name = "XTAL",    outputs = "XTAL_CLK"     },
        { name = "RC_FAST", outputs = "RC_FAST_CLK"  },
        { name = "XTAL_X2", outputs = "XTAL_X2_CLK"  },
        { name = "PLL",     outputs = "PLL_F96M_CLK" },
    ] },

    # The CPU divider must be a power of two (clk_ll_cpu_set_divider() asserts it)
    { name = "CPU_CLK", type = "generic", params = { divisor = "0, 1, 3, 7, 15, 31, 63, 127" }, output = "HP_ROOT_CLK / (divisor + 1)", always_on = true },
    # AHB_CLK divides CPU_CLK and must not exceed 32 MHz, see the clock tree figure in the TRM
    # and clk_ll_ahb_set_divider(). The PCR_AHB_DIV_NUM register description says it divides
    # HP_ROOT_CLK, but that contradicts both.
    { name = "AHB_CLK", type = "generic", params = { divisor = "0..=255" }, output = "CPU_CLK / (divisor + 1)", always_on = true },
    # PCR_APB_DIV_NUM - Set as one within (0,1,3) - pcr_reg.h
    { name = "APB_CLK", type = "generic", params = { divisor = "0, 1, 3" }, output = "AHB_CLK / (divisor + 1)" },

    # LP clocks
    { name = "XTAL_D2_CLK", type = "generic", output = "XTAL_CLK / 2" },
    # soc_rtc_fast_clk_src_t: 0 = RC_FAST, 1 = XTAL_D2 (the default).
    { name = "LP_FAST_CLK", type = "mux", variants = [
        { name = "RC_FAST_CLK", outputs = "RC_FAST_CLK" },
        { name = "XTAL_D2_CLK", outputs = "XTAL_D2_CLK" },
    ] },
    # soc_rtc_slow_clk_src_t: 0 = RC_SLOW_D4 (the default), 1 = XTAL32K,
    # 3 = OSC_SLOW.
    { name = "LP_SLOW_CLK", type = "mux", variants = [
        { name = "XTAL32K",  outputs = "XTAL32K_CLK", cfg = "use_xtal32k" },
        # The mux input is RC_SLOW/4, see rtc_clk_slow_freq_get_hz().
        { name = "RC_SLOW",  outputs = "RC_SLOW_D4_CLK" },
        { name = "OSC_SLOW", outputs = "OSC_SLOW_CLK" },
    ] },

    # PCR.timg_cali_clk_conf.timg_cali_clk_sel: 1 = XTAL32K, 3 = RC_SLOW,
    # 4 = TIMG_SECURE_CLK, where RC_FAST sits behind a /32 divider.
    # RC_SLOW is tapped before the /4 divider, so it is not LP_SLOW_CLK.
    # TODO: multiply the result by 4 in the HAL when LP_SLOW_CLK is RC_SLOW_D4,
    # like rtc_clk_cal_internal() does.
    { name = "TIMG_CALIBRATION_CLOCK", type = "mux", wake_locking = true, variants = [
        { name = "RC_SLOW_CLK",     outputs = "RC_SLOW_CLK" },
        { name = "RC_FAST_DIV_CLK", outputs = "RC_FAST_CLK" },
        { name = "XTAL32K_CLK",     outputs = "XTAL32K_CLK", cfg = "use_xtal32k" },
    ] },
], template_groups = [
    # PCR.uartX_sclk_conf.uartX_sclk_sel: 0 = XTAL, 1 = RC_FAST, 2 = PLL_F48M,
    # see uart_ll_set_sclk().
    { group = "UART", clocks = [
        { name = "FUNCTION_CLOCK", type = "generic", wake_locking = true, output = "sclk / (div_num + 1)", params = { sclk = [
            { name = "PLL_F48M", outputs = "PLL_F48M_CLK", default = true },
            { name = "RC_FAST",  outputs = "RC_FAST_CLK" },
            { name = "XTAL",     outputs = "XTAL_CLK" },
        ], div_num = "0 .. 0x100" } },
        { name = "BAUD_RATE_GENERATOR", type = "generic", output = "(FUNCTION_CLOCK * 16) / (integral * 16 + fractional)", params = { fractional = "0..16", integral = "0..0x1000" } },
    ] },
    # PCR.spiX_clkm_conf.spiX_clkm_sel, see TRM 8.5 and SOC_SPI_CLKS.
    { group = "SPI", clocks = [
        { name = "FUNCTION_CLOCK", type = "mux", wake_locking = true, variants = [
            { name = "XTAL",     outputs = "XTAL_CLK" },
            { name = "PLL_F48M", outputs = "PLL_F48M_CLK", default = true },
            { name = "RC_FAST",  outputs = "RC_FAST_CLK" },
        ] },
    ] },
    # Sources: SOC_GPTIMER_CLKS and SOC_MWDT_CLKS. Like the other chips we default
    # to XTAL
    { group = "TIMG", clocks = [
        { name = "FUNCTION_CLOCK", type = "mux", variants = [
            { name = "XTAL_CLK",    outputs = "XTAL_CLK", default = true },
            { name = "RC_FAST_CLK", outputs = "RC_FAST_CLK" },
            { name = "PLL_F48M",    outputs = "PLL_F48M_CLK" },
        ] },
        { name = "WDT_CLOCK", type = "mux", variants = [
            { name = "XTAL_CLK",    outputs = "XTAL_CLK", default = true },
            { name = "RC_FAST_CLK", outputs = "RC_FAST_CLK" },
            { name = "PLL_F48M",    outputs = "PLL_F48M_CLK" },
        ] },
    ] },
] }

peripheral_clocks = { templates = [
    { name = "default_clk_en_template", value = "{{control}}::regs().{{conf_register}}().modify(|_, w| w.{{clk_en_field}}().bit(enable));" },
    { name = "clk_en_template", value = "{{default_clk_en_template}}" },
    { name = "rst_template", value = "{{control}}::regs().{{conf_register}}().modify(|_, w| w.{{rst_field}}().bit(reset));" },
    { name = "control", value = "crate::peripherals::SYSTEM" },
    { name = "conf_register", value = "{{peripheral}}_conf" },
    { name = "clk_en_field", value = "{{peripheral}}_clk_en" },
    { name = "rst_field", value = "{{peripheral}}_rst_en" },
], peripheral_clocks = [
    { name = "Uart0", template_params = { conf_register = "uart(0).conf", clk_en_field = "clk_en", rst_field = "rst_en" }, keep_enabled = true },
    { name = "Uart1", template_params = { conf_register = "uart(1).conf", clk_en_field = "clk_en", rst_field = "rst_en" } },
    { name = "Timg0", template_params = { conf_register = "timergroup0_conf", clk_en_field = "tg0_clk_en", rst_field = "tg0_rst_en" }, keep_enabled = true },
    { name = "Timg1", template_params = { conf_register = "timergroup1_conf", clk_en_field = "tg1_clk_en", rst_field = "tg1_rst_en" } },
    { name = "Systimer", keep_enabled = true },
    { name = "AhbGdma", template_params = { peripheral = "gdma" } },
    { name = "Aes" },
    { name = "Ecc" },
    { name = "Ledc" },
    # Besides the function clock that drives the glitch filter, the PCNT has a separate register
    # clock. Register accesses are dropped while it is gated, and both boot disabled.
    { name = "Pcnt", template_params = { clk_en_template = "{{default_clk_en_template}} {{reg_clk_en_template}}", reg_clk_en_template = "{{control}}::regs().pcnt_conf().modify(|_, w| w.pcnt_reg_clk_en().bit(enable));", rst_template = "{{control}}::regs().pcnt_conf().modify(|_, w| { w.pcnt_rst_en().bit(reset); w.pcnt_reg_rst_en().bit(reset) });" } },
    # The channel RAM boots powered down and reads return zeros. ESP-IDF's `rmt_hal_init` only
    # withdraws the low power request, the power itself stays under hardware control.
    { name = "Rmt", template_params = { clk_en_template = "{{default_clk_en_template}} {{mem_pu_template}}", mem_pu_template = "{{control}}::regs().rmt_mem_lp_ctrl().modify(|_, w| w.rmt_mem_lp_en().bit(!enable));" } },
    { name = "Sha" },
    { name = "Spi2", template_params = { peripheral = "spi2" } },
    { name = "Spi3", template_params = { peripheral = "spi3" } },
    { name = "GpioSd", template_params = { clk_en_template = "crate::peripherals::GPIO_SD::regs().clock_gate().modify(|_, w| w.clk_en().bit(enable));", rst_template = "let _ = reset;" } },
    { name = "ParlIo", template_params = { clk_en_field = "parl_clk_en", rst_field = "parl_rst_en" } },
    { name = "I2s0", template_params = { peripheral = "i2s" } },
    { name = "I2cExt0", template_params = { peripheral = "i2c0" } },
    { name = "I2cExt1", template_params = { peripheral = "i2c1" } },
    # The RNG's clocks are not listed here: nothing requests them, and enabling the RNG takes more
    # than a clock gate, so `pre_init` runs IDF's `rng_ll_enable` sequence instead.
    { name = "Uhci0", template_params = { peripheral = "uhci" } },
    { name = "UsbDevice", keep_enabled = true },
] }
