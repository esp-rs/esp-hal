# see esp-idf components/esp_hw_support/port/esp32h4/rtc_time.c
rc_fast_calibration = { divider = 32, min_rev = 0 }
# The calibration mux taps RC_SLOW ahead of the /4 divider that produces LP_SLOW_CLK, so we
# counted four input cycles per cycle of the clock we want to measure. esp-idf scales
# `cal_val` the same way, see rtc_clk_cal_internal() in
# components/esp_hw_support/port/esp32h4/rtc_time.c.
rc_slow_calibration = { multiplier = 4 }

