version = 3
has_input_sync = true
# PIN_FUNC_GPIO = 1 (from io_mux_reg.h)
gpio_function = 1
# From gpio_pins.h: GPIO_MATRIX_CONST_ONE_INPUT = 0x40, GPIO_MATRIX_CONST_ZERO_INPUT = 0x60
constant_0_input = 0x60
constant_1_input = 0x40
# GPIO0-5 double as LP_GPIO0-5, but ESP-IDF does not describe the LP IO MUX for this chip
# yet, so the `lp` functions are left out until LP IO support is added.
pins = [
    { pin =  0 },
    { pin =  1 },
    { pin =  2 },
    { pin =  3 },
    { pin =  4,                            analog = { 0 = "XTAL_32K_N" } },
    { pin =  5,                            analog = { 0 = "XTAL_32K_P" } },
    { pin =  6,                                                            limitations = ["spi_flash"] }, # SPICS1
    { pin =  7,                                                            limitations = ["spi_flash"] }, # SPICS0
    { pin =  8,                                                            limitations = ["spi_flash"] }, # SPIQ
    { pin =  9,                                                            limitations = ["spi_flash"] }, # SPIWP
    { pin = 10,                                                            limitations = ["spi_flash"] }, # SPIHD
    { pin = 11,                                                            limitations = ["spi_flash"] }, # SPICLK
    { pin = 12,                                                            limitations = ["spi_flash"] }, # SPID
    { pin = 13,                            analog = { 0 = "USJ_DM" } },
    { pin = 14,                            analog = { 0 = "USJ_DP" } },
    { pin = 15, functions = { 2 = "FSPIQ"    } },
    { pin = 16, functions = { 2 = "FSPICLK"  } },
    { pin = 17, functions = { 2 = "FSPID"    } },
    { pin = 18, functions = { 2 = "FSPIWP"   } },
    { pin = 19, functions = { 2 = "FSPIHD"   } },
    { pin = 20, functions = { 2 = "FSPICS0"  } },
    { pin = 21 }, # USB OTG PHY D-
    { pin = 22 }, # USB OTG PHY D+
    { pin = 23, functions = { 0 = "U0RXD"    } },
    { pin = 24, functions = { 0 = "U0TXD"    } },
    # Per the datasheet's Boot Configurations chapter, GPIO25 selects the VO_FLASH voltage and
    # GPIO36 the JTAG signal source. The boot mode and ROM message printing are strapped by the
    # dedicated STRAP_MODE_0 and STRAP_MODE_1 pins, which are not GPIOs.
    { pin = 25,                                                            limitations = ["strapping"] },
    { pin = 26 },
    { pin = 27 },
    { pin = 28, functions = { 0 = "MTMS"     }, analog = { 0 = "ADC1_CH0" } },
    { pin = 29, functions = { 0 = "MTDI"     }, analog = { 0 = "ADC1_CH1" } },
    { pin = 30, functions = { 0 = "MTCK"     }, analog = { 0 = "ADC1_CH2" } },
    { pin = 31, functions = { 0 = "MTDO"     }, analog = { 0 = "ADC1_CH3" } },
    { pin = 32, functions = { 2 = "FSPICLK"  }, analog = { 0 = "ADC1_CH4" } },
    { pin = 33, functions = { 2 = "FSPID"    } },
    { pin = 34 },
    { pin = 35 },
    { pin = 36, functions = { 2 = "FSPIQ"    },                            limitations = ["strapping"] },
    { pin = 37, functions = { 2 = "FSPIWP"   } },
    { pin = 38, functions = { 2 = "FSPIHD"   } },
    { pin = 39, functions = { 2 = "FSPICS0"  } },
]
