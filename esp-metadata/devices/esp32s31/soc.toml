# ESP32-S31 Device Metadata
#
# Empty [`device.driver`] tables imply `partial` support status.
#
# If you modify a driver support status, run `cargo xtask update-metadata` to
# update the table in the esp-hal README.

[device]
name   = "esp32s31"
arch   = "riscv"
target = "riscv32imafc-unknown-none-elf"
cores  = 2
datasheet = "https://www.espressif.com/sites/default/files/documentation/esp32-s31_datasheet_en.pdf"
trm       = "https://www.espressif.com/sites/default/files/documentation/esp32-s31_technical_reference_manual_en.pdf"

[device.mmu]
page_size = 0x10000
entry_num = 1024

[device.rom]
has_crc_le  = true
has_crc_be  = true
has_md5_bsd = true

[device.soc]
multi_core_enabled = true
cpu_has_branch_predictor = true
cpu_has_csr_pc = false
cpu_csr_prv_mode = 0x810
cpu_mcause_mask = 0x3f

has_swd_watchdog = true

# SRAM_START = 0x2F000000, SRAM_SEG_END = 0x2F07AFC0 (from esp-idf ld.hp_mem_defs)
# dram2_uninit: SRAM_SEG_END..SOC_ROM_STACK_START (PRO CPU stack, reclaimable)
# SOC_ROM_STACK_START = 0x2F07CFB0 (from soc.h)
memory_map = { ranges = [
    { name = "dram", start = 0x2F00_0000, end = 0x2F07_AFC0 },
    { name = "dram2_uninit", start = 0x2F07_AFC0, end = 0x2F07_CFB0 },
    { name = "irom", start = 0x4000_0000, end = 0x5000_0000 },
    { name = "drom", start = 0x4000_0000, end = 0x5000_0000 },
] }

peripherals = [
    { name = "AES", interrupts = { peri = "AES" } },
    { name = "ASSIST_DEBUG" },
    { name = "CACHE" },
    { name = "CLIC" },
    { name = "CNNT_SYS" },
    { name = "ECC" },
    { name = "EFUSE" },
    { name = "GPIO" },
    { name = "GPIO_SD", pac = "GPIO_EXT" },
    { name = "HP_APM" },
    { name = "HP_MEM_APM" },
    { name = "HP_SYS" },
    { name = "HP_ALIVE_SYS" },
    { name = "HP_SYS_CLKRST" },
    { name = "I2C0", interrupts = { peri = "I2C0" }, clock_group = "I2C", stable = true },
    { name = "I2C1", interrupts = { peri = "I2C1" }, clock_group = "I2C", stable = true },
    { name = "INTERRUPT_CORE0" },
    { name = "INTERRUPT_CORE1" },
    { name = "IO_MUX" },
    { name = "LP_AON_CLK_RST", pac = "LP_AON_CLKRST" },
    { name = "LP_APM" },
    { name = "LP_PERI", pac = "LP_PERICLKRST" },
    { name = "LP_SYS" },
    { name = "LP_TEE" },
    { name = "LP_WDT" },
    { name = "LPWR", pac = "PMU" },
    { name = "MEM_MONITOR", pac = "MEM_MONITOR0" },
    { name = "MODEM_LPCON" },
    { name = "MODEM_SYSCON" },
    { name = "PAU" },
    { name = "PMU" },
    { name = "RTC_TIMER", pac = "LP_TIMER" },
    { name = "RNG", pac = "TRNG" },
    { name = "RSA", interrupts = { peri = "RSA" } },
    { name = "SPI0" },
    { name = "SPI1" },
    { name = "SPI2", interrupts = { peri = "SPI2" }, clock_group = "SPI", stable = true },
    { name = "SPI3", interrupts = { peri = "SPI3" }, clock_group = "SPI", stable = true },
    { name = "AXI_GDMA", pac = "AXI_DMA" },
    { name = "SHA" },
    { name = "SYSTEM", pac = "HP_SYS" },
    { name = "SYSTIMER" },
    { name = "TEE" },
    { name = "TIMG0", clock_group = "TIMG" },
    { name = "TIMG1", clock_group = "TIMG" },
    { name = "UART0", interrupts = { peri = "UART0" }, clock_group = "UART", stable = true },
    { name = "UART1", interrupts = { peri = "UART1" }, clock_group = "UART", stable = true },
    { name = "UART2", interrupts = { peri = "UART2" }, clock_group = "UART", stable = true },
    { name = "UART3", interrupts = { peri = "UART3" }, clock_group = "UART", stable = true },
    { name = "USB_DEVICE" },
    { name = "USB_HS", pac = "USB_OTG_HS", interrupts = { peri = "USB_OTG_HS" } },

    { name = "FLASH", virtual = true },
    { name = "SW_INTERRUPT", virtual = true },
    { name = "CPU_CTRL", virtual = true },
]

[device.soc.clocks]
# {include clocks.toml}

[device.interrupts]
support_status = "partial"
# 169 interrupt sources => ceil(169/32) = 6 status words
status_registers = 6
software_interrupt_count = 4
controller = { Riscv = { flavour = "clic", interrupts = 48, priority_levels = 8 } }

[device.timergroup]
support_status = "partial"
instances = [{ name = "timg0" }, { name = "timg1" }]
timg_has_divcnt_rst = true
rc_fast_calibration = { divider = 50, min_rev = 0 }

[device.gpio]
support_status = "supported"
# {include gpio.toml}

[device.io_mux]

[device.uart]
support_status = "supported"
instances = [
    { name = "uart0", sys_instance = "Uart0", tx = "U0TXD", rx = "U0RXD", cts = "U0CTS", rts = "U0RTS" },
    { name = "uart1", sys_instance = "Uart1", tx = "U1TXD", rx = "U1RXD", cts = "U1CTS", rts = "U1RTS" },
    { name = "uart2", sys_instance = "Uart2", tx = "U2TXD", rx = "U2RXD", cts = "U2CTS", rts = "U2RTS" },
    { name = "uart3", sys_instance = "Uart3", tx = "U3TXD", rx = "U3RXD", cts = "U3CTS", rts = "U3RTS" },
]
ram_size = 128
version = 2
peripheral_controls_mem_clk = true
has_sclk_enable = true

[device.i2c_master]
support_status = "supported"
version = 3
instances = [
    { name = "i2c0", sys_instance = "I2c0", scl = "I2CEXT0_SCL", sda = "I2CEXT0_SDA" },
    { name = "i2c1", sys_instance = "I2c1", scl = "I2CEXT1_SCL", sda = "I2CEXT1_SDA" },
]
has_fsm_timeouts = true
has_hw_bus_clear = true
ll_intr_mask = 0x3ffff
fifo_size = 32
has_bus_timeout_enable = true
max_bus_timeout = 0x1F
can_estimate_nack_reason = true
has_conf_update = true
has_reliable_fsm_reset = true
has_arbitration_en = true
has_tx_fifo_watermark = true
bus_timeout_is_exponential = true
has_pd_en = true

[device.systimer]

[device.lp_timer]

[device.assist_debug]
support_status = "not_supported"
has_sp_monitor = false
has_region_monitor = true

[device.rng]
support_status = { status = "partial", issue = 5977 }
trng_supported = false  # TODO
apb_cycle_wait_num = 16 # TODO
is_lp_sys = false

[device.sleep]
support_status = "not_supported"
light_sleep = true
deep_sleep = true
wakeup_sources = {
    LpCore = 0,
    Gpio = 2,
    Usb = 3,
    Uart1 = 7,
    Uart0 = 8,
    Ext1 = 12,
    Timer = 13,
    Wifi = 22,
    WifiBeacon = 23,
    Bt = 25,
}

[device.usb_otg_hs]
fifo_depth_words = 896

[device.spi_master]
version = 3
fifo_size = 64
support_status = "supported"
has_octal = true
has_app_interrupts = true
has_dma_segmented_transfer = true
instances = [
    {
        name = "spi2",
        sys_instance = "Spi2",
        sclk = "FSPICLK",
        sio = ["FSPID", "FSPIQ", "FSPIWP", "FSPIHD", "FSPIIO4", "FSPIIO5", "FSPIIO6", "FSPIIO7"],
        cs = ["FSPICS0", "FSPICS1", "FSPICS2", "FSPICS3", "FSPICS4", "FSPICS5"]
    },
    {
        name = "spi3",
        sys_instance = "Spi3",
        sclk = "SPI3_CK",
        sio = ["SPI3_D", "SPI3_Q", "SPI3_WP", "SPI3_HOLD"],
        cs = ["SPI3_CS", "SPI3_CS1", "SPI3_CS2"]
    },
]

[device.spi_slave]
support_status = "not_supported"

[device.dma]
support_status = "partial"
gdma_version = 2
separate_in_out_interrupts = true
# TODO: add AHB_GDMA and LP_GDMA engines
engines = [
    {
        name = "AXI_GDMA",
        max_priority = 15,
        internal_ram_burst_sizes = [8, 16, 32, 64],
        drivers = ["spi_master", "aes"],
        peripheral_instances = [
            { name = "SPI2", dma_id = 1 },
            { name = "SPI3", dma_id = 2 },
            { name = "AES",  dma_id = 4 },
        ],
        channels = [
            { name = "DMA_AXI_CH0", mem2mem = true, mem2mem_id = 6, interrupt_in = "AXI_PDMA_IN_CH0", interrupt_out = "AXI_PDMA_OUT_CH0" },
            { name = "DMA_AXI_CH1", mem2mem = true, mem2mem_id = 7, interrupt_in = "AXI_PDMA_IN_CH1", interrupt_out = "AXI_PDMA_OUT_CH1" },
            { name = "DMA_AXI_CH2", mem2mem = true, mem2mem_id = 8, interrupt_in = "AXI_PDMA_IN_CH2", interrupt_out = "AXI_PDMA_OUT_CH2" },
        ]
    },
]

[device.ecc]
support_status = { status = "partial", issue = 5972 }
working_modes = [
    { id = 0, mode = "affine_point_multiplication" },
    { id = 2, mode = "affine_point_verification" },
    { id = 3, mode = "affine_point_verification_and_multiplication" },
    { id = 4, mode = "jacobian_point_multiplication" },
    { id = 5, mode = "affine_point_addition" },
    { id = 6, mode = "jacobian_point_verification" },
    { id = 7, mode = "affine_point_verification_and_jacobian_point_multiplication" },
    { id = 8, mode = "modular_addition" },
    { id = 9, mode = "modular_subtraction" },
    { id = 10, mode = "modular_multiplication" },
    { id = 11, mode = "modular_division" }
]
curves = [
    { id = 0, curve = 192 },
    { id = 1, curve = 256 },
    { id = 2, curve = 384 },
    # TODO: SM2 = 3
]
separate_jacobian_point_memory = true
has_memory_clock_gate = true
supports_enhanced_security = true

[device.aes]
support_status = "partial"
has_split_text_registers = true
endianness_configurable = false
dma_mode = ["ECB", "CBC", "OFB", "CTR", "CFB8", "CFB128", "GCM"]
key_length = { options = [
    { bits = 128, encrypt_mode = 0, decrypt_mode = 4 },
    { bits = 256, encrypt_mode = 2, decrypt_mode = 6 },
] }

[device.rsa]
support_status = "partial"
version = 3 # v3-shaped, but contains RSA_CLK_FORCE_ON_REG
size_increment = 32
memory_size_bytes = 512

[device.sha]
support_status = { status = "partial", issue = 5973 }
algo = {
    sha1 = 0,
    sha224 = 1,
    sha256 = 2,
    sha384 = 3,
    sha512 = 4,
    sha512_224 = 5,
    sha512_256 = 6,
    sha512_t = 7,
    # TODO: sm3 = 14
}

[device.hmac]
support_status = "not_supported"
[device.ds]
support_status = "not_supported"
[device.ecdsa]
support_status = "not_supported"
