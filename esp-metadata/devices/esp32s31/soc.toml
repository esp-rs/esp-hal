separate_in_out_interrupts = true
# TODO: add LP_GDMA engine
engines = [
    {
        name = "AHB_GDMA",
        max_priority = 15,
        burst_sizes = [0, 4, 16, 32, 64],
        drivers = ["uhci", "i2s"],
        peripheral_instances = [
            { name = "UHCI0", dma_id = 0 },
            { name = "I2S0", dma_id = 1 },
            { name = "I2S1", dma_id = 5 },
        ],
        channels = [
            { name = "DMA_CH0", mem2mem = true, mem2mem_id = 9, interrupt_in = "AHB_PDMA_IN_CH0", interrupt_out = "AHB_PDMA_OUT_CH0" },
            { name = "DMA_CH1", interrupt_in = "AHB_PDMA_IN_CH1", interrupt_out = "AHB_PDMA_OUT_CH1" },
            { name = "DMA_CH2", interrupt_in = "AHB_PDMA_IN_CH2", interrupt_out = "AHB_PDMA_OUT_CH2" },
            { name = "DMA_CH3", interrupt_in = "AHB_PDMA_IN_CH3", interrupt_out = "AHB_PDMA_OUT_CH3" },
            { name = "DMA_CH4", interrupt_in = "AHB_PDMA_IN_CH4", interrupt_out = "AHB_PDMA_OUT_CH4" },
        ]
    },
    {
        name = "AXI_GDMA",
        max_priority = 15,
        burst_sizes = [8, 16, 32, 64, 128],
        drivers = ["spi_master", "spi_slave", "aes", "lcd_cam"],
