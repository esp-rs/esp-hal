system_clocks = { clock_tree = [
    # High-speed clock sources
    { name = "XTAL_CLK",    type = "source",  output = "40_000_000", always_on = true },
    { name = "BBPLL_CLK",   type = "derived", from = "XTAL_CLK", output = "480 * 1_000_000" },
    { name = "CPLL_CLK",    type = "derived", from = "XTAL_CLK", output = "320 * 1_000_000" },
    { name = "MPLL_CLK",    type = "derived", from = "XTAL_CLK", output = "500 * 1_000_000" },
    { name = "RC_FAST_CLK", type = "source",                     output = "17_500_000" },

    # Low-speed clocks
    { name = "XTAL32K_CLK",  type = "source", output = "32768", cfg = "use_xtal32k" },
    { name = "RC_SLOW_CLK",  type = "source", output = "136_000" },

    # BBPLL divider taps (480MHz / N)
    { name = "PLL_F20M",  type = "generic", output = "BBPLL_CLK / 24" },
    { name = "PLL_F80M",  type = "generic", output = "BBPLL_CLK / 6"  },
    { name = "PLL_F120M", type = "generic", output = "BBPLL_CLK / 4"  },
    { name = "PLL_F160M", type = "generic", output = "BBPLL_CLK / 3"  },
    { name = "PLL_F240M", type = "generic", output = "BBPLL_CLK / 2"  },

    { name = "PLL_F25M", type = "generic", output = "MPLL_CLK / 20" },
    { name = "PLL_F50M", type = "generic", output = "MPLL_CLK / 10" },

    # XTAL half
    { name = "XTAL_D2_CLK", type = "generic", output = "XTAL_CLK / 2" },

    # CPU root clock
    { name = "CPU_ROOT_CLK", type = "mux", variants = [
        { name = "XTAL",      outputs = "XTAL_CLK" },
        { name = "CPLL",      outputs = "CPLL_CLK" },
        { name = "RC_FAST",   outputs = "RC_FAST_CLK" },
        { name = "PLL_F240M", outputs = "PLL_F240M" },
    ] },

    { name = "CPU_CLK", type = "generic", params = { divisor = "0..256" }, output = "CPU_ROOT_CLK / (divisor + 1)" },
    { name = "AHB_CLK", type = "generic", params = { divisor = "0..256" }, output = "CPU_CLK / (divisor + 1)" },
    # APB is a core system bus and must not be released with a peripheral clock.
    { name = "APB_CLK", type = "generic", params = { divisor = "0..256" }, output = "AHB_CLK / (divisor + 1)", always_on = true },

    # LP clocks
    { name = "LP_FAST_CLK", type = "mux", variants = [
        { name = "RC_FAST", outputs = "RC_FAST_CLK" },
        { name = "XTAL",    outputs = "XTAL_CLK" },
    ] },
    { name = "LP_SLOW_CLK", type = "mux", variants = [
        { name = "RC_SLOW",  outputs = "RC_SLOW_CLK" },
        { name = "XTAL32K",  outputs = "XTAL32K_CLK", cfg = "use_xtal32k" },
    ] },

    {
        name = "IOMUX_FUNCTION_CLOCK", type = "generic", output = "source / (div_num + 1)", always_on = true,
        params = {
            source = [
                { name = "XTAL_CLK", outputs = "XTAL_CLK" },
                { name = "PLL_F80M", outputs = "PLL_F80M", default = true },
            ],
            div_num = "0 .. 0x100",
        },
    },
    { name = "TIMG_CALIBRATION_CLOCK", type = "mux", wake_locking = true, variants = [
        { name = "RC_SLOW_CLK",     outputs = "RC_SLOW_CLK" },
        { name = "RC_FAST_DIV_CLK", outputs = "RC_FAST_CLK" },
        { name = "XTAL32K_CLK",     outputs = "XTAL32K_CLK", cfg = "use_xtal32k" },
    ] },
], template_groups = [
    { group = "PSRAM", clocks = [
        { name = "FUNCTION_CLOCK", type = "mux", variants = [
            { name = "XTAL", outputs = "XTAL_CLK", default = true },
            { name = "MPLL", outputs = "MPLL_CLK" },
            { name = "CPLL", outputs = "CPLL_CLK" },
        ] },
    ] },
    { group = "UART", clocks = [
        { name = "FUNCTION_CLOCK", type = "generic", output = "sclk / (div_num + 1)", params = { sclk = [
            { name = "PLL_F80M", outputs = "PLL_F80M", default = true },
            { name = "XTAL",     outputs = "XTAL_CLK" },
            { name = "RC_FAST",  outputs = "RC_FAST_CLK" },
        ], div_num = "0 .. 0x100" } },
        { name = "BAUD_RATE_GENERATOR", type = "generic", output = "(FUNCTION_CLOCK * 16) / (integral * 16 + fractional)", params = { fractional = "0..16", integral = "0..0x1000" } },
        { name = "MEM_CLOCK", type = "generic", output = "APB_CLK" },
    ] },
    { group = "TIMG", clocks = [
        { name = "FUNCTION_CLOCK", type = "mux", variants = [
            { name = "PLL_F80M",    outputs = "PLL_F80M", default = true },
            { name = "RC_FAST_CLK", outputs = "RC_FAST_CLK" },
            { name = "XTAL_CLK",    outputs = "XTAL_CLK" },
        ] },
        { name = "WDT_CLOCK", type = "mux", variants = [
            { name = "XTAL_CLK",    outputs = "XTAL_CLK", default = true },
            { name = "PLL_F80M",    outputs = "PLL_F80M" },
            { name = "RC_FAST_CLK", outputs = "RC_FAST_CLK" },
        ] },
    ] },
    { group = "SPI", clocks = [
        { name = "FUNCTION_CLOCK", type = "mux", variants = [
            { name = "BBPLL",   outputs = "BBPLL_CLK", default = true },
            { name = "XTAL",    outputs = "XTAL_CLK" },
            { name = "RC_FAST", outputs = "RC_FAST_CLK" },
        ] },
    ] },
    { group = "I2C", clocks = [
        { name = "FUNCTION_CLOCK", type = "generic", output = "sclk / (div_num + 1)", params = { sclk = [
            { name = "XTAL",    outputs = "XTAL_CLK", default = true },
            { name = "RC_FAST", outputs = "RC_FAST_CLK" },
        ], div_num = "0 .. 0x100" } },
    ] },
    { group = "RMT", clocks = [
        { name = "SCLK", type = "mux", wake_locking = true, variants = [
            { name = "PLL_F80M",    outputs = "PLL_F80M", default = true },
            { name = "RC_FAST_CLK", outputs = "RC_FAST_CLK" },
            { name = "XTAL_CLK",    outputs = "XTAL_CLK" },
        ] },
    ] },
    { group = "SDM", clocks = [
        { name = "FUNCTION_CLOCK", type = "generic", output = "IOMUX_FUNCTION_CLOCK" },
    ] },
] }

peripheral_clocks = { templates = [
    { name = "clk_en_template",       value = "{{default_clk_template}}" },
    { name = "rst_template",          value = "{{default_rst_template}}" },

    { name = "base",                  value = "crate::peripherals::HP_SYS_CLKRST::regs()" },
    { name = "ctrl_reg",              value = "{{peripheral}}_ctrl0()" },

    # Clock
    { name = "default_clk_template",  value = "{{base}}.{{ctrl_reg}}.modify(|_, w| w {{clk_en}});" },
    { name = "crypto_clk",            value = ".crypto_{{peripheral}}_clk_en().bit(enable)" },
    { name = "clk_en",                value = "{{sys_clk}} {{apb_clk}}" },
    
    { name = "sys_clk",               value = ".sys_clk_en().bit(enable)" },
    { name = "apb_clk",               value = ".apb_clk_en().bit(enable)" },
    { name = "peri_clk",              value = ".clk_en().bit(enable)" },

    # Reset
    { name = "default_rst_template",  value = "{{base}}.{{ctrl_reg}}.modify(|_, w| w {{rst_en}});" },
    { name = "rst_en",                value = ".rst_en().bit(reset)" },
    { name = "crypto_rst",            value = ".crypto_{{peripheral}}_rst_en().bit(reset)" },

    { name = "no_rst",                value = "let _ = reset;" },
    { name = "uart_rst",              value = ".core_rst_en().bit(reset).apb_rst_en().bit(reset)" },
], peripheral_clocks = [
    { name = "Uart0", template_params = { rst_en = "{{uart_rst}}", ctrl_reg = "uart_ctrl0(0)" }, keep_enabled = true },
    { name = "Uart1", template_params = { rst_en = "{{uart_rst}}", ctrl_reg = "uart_ctrl0(1)" } },
    { name = "Uart2", template_params = { rst_en = "{{uart_rst}}", ctrl_reg = "uart_ctrl0(2)" } },
    { name = "Uart3", template_params = { rst_en = "{{uart_rst}}", ctrl_reg = "uart_ctrl0(3)" } },

    { name = "Spi2", template_params = { peripheral = "gpspi2" } },
    { name = "Spi3", template_params = { peripheral = "gpspi3" } },
    { name = "I2c0", template_params = { clk_en = "{{apb_clk}} {{peri_clk}}", ctrl_reg = "i2c_ctrl0(0)" } },
    { name = "I2c1", template_params = { clk_en = "{{apb_clk}} {{peri_clk}}", ctrl_reg = "i2c_ctrl0(1)" } },
    { name = "SdioHost", template_params = { clk_en = "{{sys_clk}}", rst_template = "crate::peripherals::CNNT_SYS::regs().sys_hp_sdmmc_ctrl().modify(|_, w| w.sys_sdmmc_rst_en().bit(reset));" } },
    # DMA engines
    { name = "AxiGdma", template_params = { peripheral = "axi_pdma", clk_en = "{{sys_clk}}" } },
    { name = "AhbGdma", template_params = { peripheral = "ahb_pdma", clk_en = "{{sys_clk}}" } },
    { name = "Uhci0", template_params = { peripheral = "uhci" } },
    # USB
    { name = "UsbHs", template_params = { peripheral = "usb_otghs", rst_template = "{{no_rst}}" } },
    # APB gate in HP_SYS_CLKRST; 48 MHz PHY clock and reset in CNNT_SYS.
    { name = "UsbDevice", template_params = {
        clk_en = "{{apb_clk}}",
        clk_en_template = "{{default_clk_template}} crate::peripherals::CNNT_SYS::regs().sys_hp_usb_device_ctrl().modify(|_, w| w.sys_usb_device_48m_clk_en().bit(enable));",
        rst_template = "crate::peripherals::CNNT_SYS::regs().sys_hp_usb_device_ctrl().modify(|_, w| w.sys_usb_device_rst_en().bit(reset));"
    }, keep_enabled = true },
    # Crypto - there is a crypto_clk_en bit as well, luckily it starts as 1
    { name = "Aes", template_params = { ctrl_reg = "crypto_ctrl0()", clk_en = "{{crypto_clk}}", rst_en = "{{crypto_rst}}" } },
    { name = "Ecc", template_params = { ctrl_reg = "crypto_ctrl0()", clk_en = "{{crypto_clk}}", rst_en = "{{crypto_rst}}" } },
    { name = "Sha", template_params = { ctrl_reg = "crypto_ctrl0()", clk_en = "{{crypto_clk}}", rst_en = "{{crypto_rst}}" } },
    { name = "Rsa", template_params = { ctrl_reg = "crypto_ctrl0()", clk_en = "{{crypto_clk}}", rst_en = "{{crypto_rst}}" } },
    # Timers
    { name = "Systimer", template_params = { clk_en = "{{apb_clk}} {{peri_clk}}" }, keep_enabled = true },
    { name = "Timg0", template_params = { peripheral = "timergrp0", clk_en = "{{apb_clk}}" }, keep_enabled = true },
    { name = "Timg1", template_params = { peripheral = "timergrp1", clk_en = "{{apb_clk}}" } },
    # ADC -- clock and reset live in LP_PERI, not HP_SYS_CLKRST.
    { name = "ApbSarAdc", template_params = {
        clk_en_template = "crate::peripherals::LP_PERI::regs().adc_ctrl().modify(|_, w| w.lp_adc_clk_en().bit(enable));",
        rst_template = "crate::peripherals::LP_PERI::regs().adc_ctrl().modify(|_, w| w.lp_adc_rst_en().bit(reset));"
    } },
    { name = "Rmt", template_params = { clk_en = "{{sys_clk}}" } },
    { name = "GpioSd", template_params = { clk_en_template = "crate::peripherals::GPIO_SD::regs().clock_gate().modify(|_, w| w.clk_en().bit(enable));", rst_template = "{{no_rst}}" } },
] }
