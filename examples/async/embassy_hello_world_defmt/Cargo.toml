[package]
name    = "embassy-hello-world"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
defmt = "1.1"

embassy-executor = "0.10.0"
embassy-time = "0.5.0"
esp-backtrace = { path = "../../../esp-backtrace", features = [
    "panic-handler",
    "defmt",
] }
esp-bootloader-esp-idf = { path = "../../../esp-bootloader-esp-idf" }
esp-hal = { path = "../../../esp-hal", features = ["defmt", "unstable"] }
esp-rtos = { path = "../../../esp-rtos", features = ["embassy", "defmt"] }
esp-log = { path = "../../../esp-log", features = ["defmt"] }

[features]
esp32 = [
    "esp-log/esp32",
    "esp-backtrace/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-rtos/esp32",
    "esp-hal/esp32",
]
esp32c2 = [
    "esp-log/esp32c2",
    "esp-backtrace/esp32c2",
    "esp-bootloader-esp-idf/esp32c2",
    "esp-rtos/esp32c2",
    "esp-hal/esp32c2",
]
esp32c3 = [
    "esp-log/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-rtos/esp32c3",
    "esp-hal/esp32c3",
]
esp32c5 = [
    "esp-log/esp32c5",
    "esp-backtrace/esp32c5",
    "esp-bootloader-esp-idf/esp32c5",
    "esp-rtos/esp32c5",
    "esp-hal/esp32c5",
]
esp32c6 = [
    "esp-log/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-rtos/esp32c6",
    "esp-hal/esp32c6",
]
esp32c61 = [
    "esp-log/esp32c61",
    "esp-backtrace/esp32c61",
    "esp-bootloader-esp-idf/esp32c61",
    "esp-rtos/esp32c61",
    "esp-hal/esp32c61",
]
esp32h2 = [
    "esp-log/esp32h2",
    "esp-backtrace/esp32h2",
    "esp-bootloader-esp-idf/esp32h2",
    "esp-rtos/esp32h2",
    "esp-hal/esp32h2",
]
esp32h4 = [
    "esp-log/esp32h4",
    "esp-backtrace/esp32h4",
    "esp-bootloader-esp-idf/esp32h4",
    "esp-rtos/esp32h4",
    "esp-hal/esp32h4",
]
esp32p4 = [
    "esp-log/esp32p4",
    "esp-backtrace/esp32p4",
    "esp-bootloader-esp-idf/esp32p4",
    "esp-rtos/esp32p4",
    "esp-hal/esp32p4",
]
esp32s2 = [
    "esp-log/esp32s2",
    "esp-backtrace/esp32s2",
    "esp-bootloader-esp-idf/esp32s2",
    "esp-rtos/esp32s2",
    "esp-hal/esp32s2",
]
esp32s3 = [
    "esp-log/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-rtos/esp32s3",
    "esp-hal/esp32s3",
]
esp32s31 = [
    "esp-log/esp32s31",
    "esp-backtrace/esp32s31",
    "esp-bootloader-esp-idf/esp32s31",
    "esp-rtos/esp32s31",
    "esp-hal/esp32s31",
]

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
