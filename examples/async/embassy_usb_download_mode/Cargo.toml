[package]
name    = "embassy-usb-download-mode"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor = "0.10.0"
embassy-futures = "0.1"
embassy-usb = { version = "0.6.0", default-features = false }
esp-backtrace = { path = "../../../esp-backtrace", features = [
    "panic-handler",
    "log-04",
] }
esp-bootloader-esp-idf = { path = "../../../esp-bootloader-esp-idf" }
esp-hal = { path = "../../../esp-hal", features = ["log-04", "unstable"] }
esp-rtos = { path = "../../../esp-rtos", features = ["embassy", "log-04"] }
esp-log = { path = "../../../esp-log", features = ["log-04"] }
log = "0.4"

[features]
esp32s3 = [
    "esp-log/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-rtos/esp32s3",
    "esp-hal/esp32s3",
]

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
