[target.riscv32imafc-unknown-none-elf]
runner    = "espflash flash --monitor"
# The ESP-SR libraries use Espressif relocations that only GNU ld supports.
linker    = "riscv32-esp-elf-ld"
rustflags = [
  "-C", "linker-flavor=ld",
  "-C", "link-arg=-Tlinkall.x",
  "-C", "force-frame-pointers",
]

[env]
ESP_LOG = "info"
ESP_RADIO_CONFIG_WIFI_SOFTAP_SUPPORT = "false"
SSID = "SSID"
PASSWORD = "PASSWORD"
ANTHROPIC_API_KEY = "ANTHROPIC_API_KEY"
ESP_SR_COMPONENTS = { value = "managed_components", relative = true }

[unstable]
build-std = ["alloc", "core"]
