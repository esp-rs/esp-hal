[package]
name         = "esp-sr"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
description  = "Offline speech command recognition with Espressif's MultiNet (ESP-SR) for esp-hal"
license      = "MIT OR Apache-2.0"
links        = "esp_sr"
publish      = false

[dependencies]
critical-section = "1.2"
libm             = "0.2"
log              = "0.4"

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-alloc = { path = "../../../../esp-alloc", default-features = false }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }

[features]
## The only chip with vendored ESP-SR libraries.
esp32s31 = ["esp-alloc/esp32s31"]
