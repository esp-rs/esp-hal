[package]
name    = "voice-assistant"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
allocator-api2 = { version = "0.3.0", default-features = false, features = ["alloc"] }
embassy-executor = "0.10.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
embedded-graphics = "0.8.1"
embedded-text = "0.7.2"
esp-alloc = { path = "../../esp-alloc" }
esp-backtrace = { path = "../../esp-backtrace", features = [
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { path = "../../esp-bootloader-esp-idf" }
esp-hal = { path = "../../esp-hal", features = ["log-04", "unstable"] }
esp-metadata-generated = { path = "../../esp-metadata-generated" }
esp-println = { path = "../../esp-println", features = ["log-04"] }
esp-rtos = { path = "../../esp-rtos", features = ["embassy", "log-04"] }
esp-sr = { git = "https://github.com/SergioGasquez/esp-sr", rev = "e56a9c6" }
log = "0.4.27"
static_cell = "2.1.0"

[features]
esp32s31 = [
    "esp-alloc/esp32s31",
    "esp-backtrace/esp32s31",
    "esp-bootloader-esp-idf/esp32s31",
    "esp-hal/esp32s31",
    "esp-metadata-generated/esp32s31",
    "esp-rtos/esp32s31",
    "esp-sr/esp32s31",
]

# esp-sr allocates from the heap of esp-alloc, so it must use the same esp-alloc as this example.
[patch.crates-io]
esp-alloc = { path = "../../esp-alloc" }

[profile.dev.package.esp-hal]
# Parking a core needs esp-hal at opt-level 2 or 3
opt-level = 2

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
