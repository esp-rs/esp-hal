[package]
name    = "twai"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
esp-backtrace = { path = "../../../esp-backtrace", features = [
    "panic-handler",
    "log-04",
] }
esp-bootloader-esp-idf = { path = "../../../esp-bootloader-esp-idf" }
esp-hal = { path = "../../../esp-hal", features = ["log-04", "unstable"] }
esp-log = { path = "../../../esp-log", features = ["log-04"] }
log = "0.4"
nb = "1.1.0"

[features]
esp32 = ["esp-backtrace/esp32", "esp-bootloader-esp-idf/esp32", "esp-hal/esp32", "esp-log/esp32"]
esp32c3 = [
    "esp-log/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-hal/esp32c3",
]
esp32c6 = [
    "esp-log/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-hal/esp32c6",
]
esp32h2 = [
    "esp-log/esp32h2",
    "esp-backtrace/esp32h2",
    "esp-bootloader-esp-idf/esp32h2",
    "esp-hal/esp32h2",
]
esp32p4 = [
    "esp-log/esp32p4",
    "esp-backtrace/esp32p4",
    "esp-bootloader-esp-idf/esp32p4",
    "esp-hal/esp32p4",
]
esp32s2 = [
    "esp-log/esp32s2",
    "esp-backtrace/esp32s2",
    "esp-bootloader-esp-idf/esp32s2",
    "esp-hal/esp32s2",
]
esp32s3 = [
    "esp-log/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-hal/esp32s3",
]

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
