[package]
name    = "touch"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
critical-section = "1"
esp-backtrace = { path = "../../../esp-backtrace", features = [
    "panic-handler",
    "log-04",
] }
esp-bootloader-esp-idf = { path = "../../../esp-bootloader-esp-idf" }
esp-hal = { path = "../../../esp-hal", features = ["log-04", "unstable"] }
embedded-log = { path = "../../../embedded-log", features = ["log-04"] }
log = "0.4"
static_cell = "2.1.1"

[features]
esp32 = ["esp-backtrace/esp32", "esp-bootloader-esp-idf/esp32", "esp-hal/esp32"]

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
