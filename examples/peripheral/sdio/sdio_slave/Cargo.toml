[package]
name = "sdio-slave"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
esp-backtrace = { path = "../../../../esp-backtrace", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = { path = "../../../../esp-bootloader-esp-idf" }
esp-hal = { path = "../../../../esp-hal", features = ["log-04", "unstable"] }
esp-println = { path = "../../../../esp-println", features = ["log-04", "uart"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
static_cell = "2"
esp-rtos = { path = "../../../../esp-rtos", features = ["embassy", "log-04"] }

[features]
esp32c6 = [
    "esp-backtrace/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
]

[profile.release]
debug = true
debug-assertions = true
lto = "fat"
codegen-units = 1
