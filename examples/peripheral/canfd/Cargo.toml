[package]
name    = "canfd"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
esp-backtrace = { path = "../../../esp-backtrace", features = [
    "panic-handler",
    "log-04",
] }
esp-bootloader-esp-idf = { path = "../../../esp-bootloader-esp-idf" }
esp-hal = { path = "../../../esp-hal", features = ["log-04", "unstable"] }
esp-log = { path = "../../../esp-log", features = ["log-04"] }
log = "0.4"

[features]
esp32c5 = [
    "esp-log/esp32c5",
    "esp-backtrace/esp32c5",
    "esp-bootloader-esp-idf/esp32c5",
    "esp-hal/esp32c5",
]
esp32h4 = [
    "esp-log/esp32h4",
    "esp-backtrace/esp32h4",
    "esp-bootloader-esp-idf/esp32h4",
    "esp-hal/esp32h4",
]
esp32s31 = [
    "esp-log/esp32s31",
    "esp-backtrace/esp32s31",
    "esp-bootloader-esp-idf/esp32s31",
    "esp-hal/esp32s31",
]

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
