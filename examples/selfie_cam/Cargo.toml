[package]
name    = "selfie-cam"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aligned = "0.4.3"
block-device-adapters = "0.2.0"
block-device-driver = "0.2.0"
critical-section = "1"
embassy-executor = "0.10.0"
embassy-futures = "0.1"
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
embedded-fatfs = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112", default-features = false }
embedded-graphics = "0.8.1"
embedded-io-async = "0.7.0"
embedded-partitions = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }
esp-alloc = { path = "../../esp-alloc" }
esp-backtrace = { path = "../../esp-backtrace", features = [
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { path = "../../esp-bootloader-esp-idf" }
esp-hal = { path = "../../esp-hal", features = ["log-04", "unstable"] }
esp-println = { path = "../../esp-println", features = ["log-04"] }
esp-rtos = { path = "../../esp-rtos", features = ["embassy", "log-04"] }
gt911 = "0.3.0"
jpeg-encoder = { version = "0.7", default-features = false }
sdio = "0.5"
static_cell = "2.1.1"
zune-core = { version = "0.5", default-features = false }
zune-jpeg = { version = "0.5", default-features = false }

[features]
esp32s31 = [
    "esp-alloc/esp32s31",
    "esp-backtrace/esp32s31",
    "esp-bootloader-esp-idf/esp32s31",
    "esp-hal/esp32s31",
    "esp-println/esp32s31",
    "esp-rtos/esp32s31",
]

[profile.dev]
opt-level = 2

[profile.release]
codegen-units    = 1
debug            = true
debug-assertions = false
lto              = "fat"
opt-level        = 3

[patch.crates-io]
block-device-adapters = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }
block-device-driver = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }
