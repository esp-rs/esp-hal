[package]
name    = "wifi_1-0"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor = "0.9.0"
embassy-net = { version = "0.7.0", features = [
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "dns",
] }
embassy-time = "0.5.0"
embedded-io-async = "0.6.1"
enumset = { version = "1.0.0", optional = true }
esp-alloc = { version = "0.9.0" }
esp-backtrace = { version = "0.18.0", features = [
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.4.0" }
esp-hal = { version = "1.0.0" , features = ["log-04", "unstable"] }
esp-println = { version = "0.16.0", features = ["log-04"] }
esp-rtos = { version = "0.2.0", features = ["esp-radio", "embassy", "log-04"] }
esp-radio = { version = "0.17.0", features = [
    "log-04",
    "wifi",
] }
reqwless = { version = "0.14.0", default-features = false }
static_cell = "2.1.0"

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
