crate: esp-rtos

options:
  - name: tick_rate_hz
    description: "Time slice rate in Hertz. Tasks sharing the same priority take turns, each running for 1/tick_rate_hz seconds.
      There is no periodic tick: slicing only happens while another task of equal priority is ready"
    default:
      - value: 100
    constraints:
      - type:
          validator: positive_integer

  - name: light_sleep_min_us
    description: "Minimum predicted sleep duration, in microseconds, required for the auto light-sleep idle hook to enter light sleep instead of WFI."
    default:
      - value: 1000
    constraints:
      - type:
          validator: positive_integer

  - name: sw-task-overflow-detection
    description: "Enable software-based stack overflow detection. The stack guard value and offset is based on esp-hal configuration."
    default:
      - value: false

  - name: stack-pointer-range-check
    description: "Enable range-check based stack overflow detection."
    default:
      - value: true

  - name: hw-task-overflow-detection
    description: "Enable hardware-based stack overflow detection. The stack watermark is based on the esp-hal stack-guard-offset configuration."
    default:
      - value: true

  - name: switch-stack-size
    description: "Size, in bytes, of the stack that the scheduler of each CPU runs on. A multiple of 16.
      On Xtensa, this stack also holds the next context (256 bytes), and the context of interrupts above level 3 that occur during a task switch."
    default:
      - value: 1536
    constraints:
      - type:
          validator: positive_integer

  - name: radio-timer-thread-priority
    description: "Priority of the timer thread serving esp-radio."
    default:
      - value: 2
    constraints:
      - type:
          validator: integer_in_range
          value:
            start: 2
            end: 28
