# Check with a local registry.
#
# We want to check if we can compile examples/tests after bumping the deps by using a local registry.
# (i.e. if we will publish the right set of crates)
#
# The compile-test build runs on every release PR; xtask derives its project-by-chip matrix from
# each project's metadata. The heavier examples/qa/tests build runs by default (skipped by the
# `release:registry:skip-ci` label) and loops the chips in `.github/chips.json`, the same source
# the main CI uses.

name: pre-release-checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    runs-on: macos-m1-self-hosted
    # Only release PRs (branched as `release-branch-*` by `execute-plan`) carry a
    # plan, so ordinary PRs never run this. `xrel-check` bails if the plan is
    # missing.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-branch-') }}

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-toolchains
        with:
          xtensa: "true"
          riscv: "true"

      # Install the Rust nightly toolchain for RISC-V devices:
      - uses: ./.github/actions/setup-nightly
        with:
          targets: all
          components: rust-src
          alias: "true"

      - name: Setup cargo-batch
        run: |
          if ! command -v cargo-batch &> /dev/null; then
              cargo install --git https://github.com/embassy-rs/cargo-batch cargo --bin cargo-batch --locked --force
          fi

      # Warm the chip-metadata cache while crates.io is still reachable. A cold
      # cache makes the later `build` step regenerate `esp-metadata-generated`,
      # which builds the `esp-metadata` tool - and that host tool cannot resolve
      # its dependencies (e.g. `prettyplease`) against the local registry.
      - name: warm-metadata-cache
        run: cargo update-metadata

      - name: init-local-registry
        run: |
          cargo xrel-check init
          cargo xrel-check update
          cargo xrel-check replace-path-deps

      # Build the compile-tests against the local registry. xtask derives the
      # project-by-chip matrix from each project's metadata (and the toolchain
      # per chip), so there is no fixed chip set to keep in sync here.
      - name: try-build [compile-tests]
        run: cargo xtask build compile-tests

      # Build the examples/qa/tests against the local registry. Runs by default;
      # add `release:registry:skip-ci` to the PR to opt out of this heavy check.
      - name: try-build [examples/qa/tests]
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'release:registry:skip-ci') }}
        shell: bash
        run: |
          # lints and docs are checked a couple of times already by other workflows
          for soc in $(jq -r '.[].soc' .github/chips.json); do
            toolchain=$(jq -r --arg s "$soc" \
              '.[] | select(.soc == $s) | ."ci-toolchain"' .github/chips.json)
            echo "::group::examples/qa/tests $soc ($toolchain)"
            cargo xcheck ci "$soc" --toolchain "$toolchain" --steps=lp-examples,examples,qa-test,tests
            echo "::endgroup::"
          done
