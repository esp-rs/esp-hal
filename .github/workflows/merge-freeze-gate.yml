# Required status check enforcing the merge freeze.
#
# Merge-queue-only: open pull requests are never touched, so no other CI is
# re-triggered.

name: Merge freeze gate

on:
  merge_group:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  merge-freeze-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Base branch, not the queue branch.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/github-script@v8
        with:
          script: |
            const { gate } = require('./.github/scripts/merge-freeze.js');
            await gate({ github, context, core });
