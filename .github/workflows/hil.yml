name: HIL

run-name: >-
  ${{ format('{0}{1}',
      inputs.pr_number != '' &&
        format('HIL for PR #{0} ({1}{2}{3})', inputs.pr_number, inputs.chips, inputs.tests != '' && format('; tests: {0}', inputs.tests) || '', inputs.package != '' && inputs.package != 'all' && format('; package: {0}', inputs.package) || '') ||
        format('HIL ({0}{1}{2})', inputs.chips, inputs.tests != '' && format('; tests: {0}', inputs.tests) || '', inputs.package != '' && inputs.package != 'all' && format('; package: {0}', inputs.package) || ''),
      inputs.distinct_id != '' && format(' [dispatch-id: {0}]', inputs.distinct_id) || ''
  ) }}

on:
  workflow_call:
    inputs:
      chips:
        description: 'Space-separated list of SoCs to build and test, or "all"'
        required: true
        type: string
      tests:
        description: "Optional list of test names to run (ELF basenames)"
        required: false
        type: string
        default: ""
      package:
        description: '"hil-test", "hil-test-radio", or "all"'
        required: false
        type: string
        default: "hil-test"
      # Set only by the workflow_dispatch path. Declared here with empty
      # defaults so the `inputs.branch == ''` tests that select the plain
      # checkout, enable continue-on-error and enable hil-gate are
      # well-defined on the workflow_call path too.
      repository:
        required: false
        type: string
        default: ""
      branch:
        required: false
        type: string
        default: ""
      # Not used by the workflow_call path, but referenced in run-name; declared
      # here (with empty defaults) so that expression is well-defined for both
      # triggers.
      pr_number:
        required: false
        type: string
        default: ""
      distinct_id:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      repository:
        description: "Owner and repository to test"
        required: true
        default: "esp-rs/esp-hal"
      branch:
        description: "Branch, tag or SHA to checkout."
        required: true
        default: "main"
      pr_number:
        description: "Pull request number (for slash-triggered runs)"
        required: false
        default: ""
      chips:
        description: 'Space-separated list of SoCs to build and test, or "all"'
        required: true
        default: "all"
      tests:
        description: "Optional list of test names to run (ELF basenames)"
        required: false
        default: ""
      package:
        description: '"hil-test", "hil-test-radio", or "all"'
        default: "hil-test"
      distinct_id:
        description: "Correlation marker set by the dispatcher; do not set manually"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PROBE_RS_CONFIG_PRESET: local-hil

jobs:
  build:
    runs-on: macos-m1-self-hosted
    outputs:
      matrix: ${{ steps.chips.outputs.matrix }}
      radio_matrix: ${{ steps.chips.outputs.radio_matrix }}
      has_radio: ${{ steps.chips.outputs.has_radio }}
    steps:
      - name: Resolve chip matrix
        id: chips
        env:
          REQUESTED_CHIPS: ${{ inputs.chips }}
          PKG: ${{ inputs.package }}
        run: |
          # Runner labels live here, not in .github/chips.json: this step runs
          # before the checkout, and on the dispatch path the checked-out ref is
          # not the tree this workflow came from. chips.json owns the build-side
          # chip metadata (arch, rust target). Adding a chip means editing both.
          ALL_CHIPS='[
            {"soc":"esp32",   "rust-target":"xtensa-esp32-none-elf",        "runner":"esp32-jtag",    "host":"aarch64"},
            {"soc":"esp32s2", "rust-target":"xtensa-esp32s2-none-elf",      "runner":"esp32s2-jtag",  "host":"aarch64"},
            {"soc":"esp32s3", "rust-target":"xtensa-esp32s3-none-elf",      "runner":"esp32s3-usb",   "host":"aarch64"},
            {"soc":"esp32c2", "rust-target":"riscv32imc-unknown-none-elf",  "runner":"esp32c2-jtag",  "host":"aarch64"},
            {"soc":"esp32c3", "rust-target":"riscv32imc-unknown-none-elf",  "runner":"esp32c3-usb",   "host":"aarch64"},
            {"soc":"esp32c5", "rust-target":"riscv32imac-unknown-none-elf", "runner":"esp32c5-usb",   "host":"aarch64"},
            {"soc":"esp32c6", "rust-target":"riscv32imac-unknown-none-elf", "runner":"esp32c6-usb",   "host":"aarch64"},
            {"soc":"esp32c61","rust-target":"riscv32imac-unknown-none-elf", "runner":"esp32c61-usb",  "host":"aarch64"},
            {"soc":"esp32h2", "rust-target":"riscv32imac-unknown-none-elf", "runner":"esp32h2-usb",   "host":"aarch64"},
            {"soc":"esp32p4", "rust-target":"riscv32imafc-unknown-none-elf","runner":"esp32p4",       "host":"aarch64"},
            {"soc":"esp32s31","rust-target":"riscv32imafc-unknown-none-elf","runner":"esp32s31-jtag", "host":"aarch64"}
          ]'

          # Chips that have a dedicated radio HIL runner.
          RADIO_CHIPS='[
            {"soc":"esp32c6", "rust-target":"riscv32imac-unknown-none-elf", "runner":"esp32c6-radio", "host":"aarch64"},
            {"soc":"esp32s3", "rust-target":"xtensa-esp32s3-none-elf",      "runner":"esp32s3-radio", "host":"aarch64"}
          ]'

          REQUESTED="$REQUESTED_CHIPS"
          # `all` saves callers from restating the chip list.
          if [ "$REQUESTED" = "all" ]; then
            REQUESTED=$(echo "$ALL_CHIPS" | jq -r '[.[].soc] | join(" ")')
            echo "Expanded 'all' to: $REQUESTED"
          fi

          MATRIX=$(echo "$ALL_CHIPS" | jq -c --arg chips "$REQUESTED" \
            '[.[] | select(.soc as $s | $chips | split(" ") | index($s))]')

          if [ "$(echo "$MATRIX" | jq 'length')" -eq 0 ]; then
            echo "::error::No valid chips selected from input: '$REQUESTED'"
            exit 1
          fi

          RADIO_MATRIX=$(echo "$RADIO_CHIPS" | jq -c --arg chips "$REQUESTED" \
            '[.[] | select(.soc as $s | $chips | split(" ") | index($s))]')

          # `package: hil-test` disables the radio HIL run entirely.
          if [ "$PKG" = "hil-test" ]; then
            RADIO_MATRIX='[]'
          fi

          echo "matrix={\"target\":$(echo "$MATRIX" | jq -c .)}" >> "$GITHUB_OUTPUT"
          echo "radio_matrix={\"target\":$(echo "$RADIO_MATRIX" | jq -c .)}" >> "$GITHUB_OUTPUT"
          # A plain flag for the hil-run-radio `if`, so that job condition does
          # not have to string-match the serialized matrix.
          echo "has_radio=$(echo "$RADIO_MATRIX" | jq -r 'length > 0')" >> "$GITHUB_OUTPUT"
          echo "Selected chips: $(echo "$MATRIX" | jq -r '.[].soc' | tr '\n' ' ')"
          echo "Selected radio chips: $(echo "$RADIO_MATRIX" | jq -r '.[].soc' | tr '\n' ' ')"

      - name: Determine required architectures
        id: arch
        run: |
          NEED_XTENSA=false
          NEED_RISCV=false
          # Read the resolved matrix rather than inputs.chips, so the `all`
          # sentinel expands instead of falling into the catch-all below.
          for chip in $(echo '${{ steps.chips.outputs.matrix }}' | jq -r '.target[].soc'); do
            case $chip in
              esp32|esp32s2|esp32s3) NEED_XTENSA=true ;;
              *) NEED_RISCV=true ;;
            esac
          done
          echo "xtensa=$NEED_XTENSA" >> "$GITHUB_OUTPUT"
          echo "riscv=$NEED_RISCV" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: inputs.branch == ''
      - uses: actions/checkout@v6
        if: inputs.branch != ''
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}

      - uses: esp-rs/xtensa-toolchain@v1.6
        if: steps.arch.outputs.xtensa == 'true'
        with:
          buildtargets: esp32,esp32s2,esp32s3
          default: true
          version: 1.97.0.0

      - uses: ./.github/actions/setup-nightly
        if: steps.arch.outputs.riscv == 'true'
        with:
          targets: riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf,riscv32imafc-unknown-none-elf
          components: rust-src
          alias: "true"

      # Build hil-test ELFs for each requested chip (unless the dispatch
      # asked for radio-only via package=hil-test-radio).
      - name: Build hil-test tests
        if: ${{ inputs.package != 'hil-test-radio' }}
        env:
          # The probe below only earns its keep on a dispatch, where the ref that
          # got checked out may predate a chip its xtask never learned about. On
          # the workflow_call path the tree and the chip list ship together, so
          # every chip is by definition supported and probing is pure overhead.
          PROBE_XTASK: ${{ inputs.branch != '' }}
          MATRIX: ${{ steps.chips.outputs.matrix }}
          TESTS: ${{ inputs.tests }}
        run: |
          CHIPS=$(echo "$MATRIX" | jq -r '.target[].soc')
          for chip in $CHIPS; do
            if [ "$PROBE_XTASK" = "true" ] && \
               ! cargo xtask build tests "$chip" --help >/dev/null 2>&1; then
              echo "Skipping $chip: not supported by this ref's xtask"
              continue
            fi
            if [ -n "$TESTS" ]; then
              echo "Building selected hil-test tests for $chip: $TESTS"
              cargo xtask build tests "$chip" --tests "$TESTS"
            else
              echo "Building ALL hil-test tests for $chip"
              cargo xtask build tests "$chip"
            fi
          done

      - name: Upload hil-test artifacts
        if: ${{ inputs.package != 'hil-test-radio' }}
        uses: actions/upload-artifact@v6
        with:
          name: hil-tests
          path: target/tests/
          # An unfiltered build must produce ELFs, so silence there is a real
          # failure. A --tests filter legitimately matches nothing for a chip.
          if-no-files-found: ${{ inputs.tests == '' && 'error' || 'warn' }}

      # Build hil-test-radio ELFs (unless the dispatch asked for hil-test
      # only).  Chips for which the radio package has no applicable binaries
      # produce no output and are silently skipped via if-no-files-found.
      - name: Reset tests output directory for radio build
        if: ${{ inputs.package != 'hil-test' }}
        run: rm -rf target/tests

      - name: Build hil-test-radio tests
        if: ${{ inputs.package != 'hil-test' }}
        env:
          # Same reasoning as the hil-test build above: only a dispatch can
          # land on a ref whose xtask predates a chip in the list.
          PROBE_XTASK: ${{ inputs.branch != '' }}
          MATRIX: ${{ steps.chips.outputs.matrix }}
          TESTS: ${{ inputs.tests }}
        run: |
          CHIPS=$(echo "$MATRIX" | jq -r '.target[].soc')
          for chip in $CHIPS; do
            if [ "$PROBE_XTASK" = "true" ] && \
               ! cargo xtask build tests "$chip" hil-test-radio --help >/dev/null 2>&1; then
              echo "Skipping $chip: not supported by this ref's xtask"
              continue
            fi
            if [ -n "$TESTS" ]; then
              echo "Building selected hil-test-radio tests for $chip: $TESTS"
              cargo xtask build tests "$chip" hil-test-radio --tests "$TESTS"
            else
              echo "Building ALL hil-test-radio tests for $chip"
              cargo xtask build tests "$chip" hil-test-radio
            fi
          done

      - name: Upload hil-test-radio artifacts
        if: ${{ inputs.package != 'hil-test' }}
        uses: actions/upload-artifact@v6
        with:
          name: hil-tests-radio
          path: target/tests/
          if-no-files-found: ignore

  devtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: inputs.branch == ''
      - uses: actions/checkout@v6
        if: inputs.branch != ''
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Restore everywhere, but only the dispatch path is worth saving
          # from: it runs on the default branch ref, so the entry lands in the
          # base-branch scope every later run can read. The workflow_call path
          # runs under merge_group, whose ephemeral ref nothing can restore
          # from. `cross` mounts $CARGO_HOME, so a warm registry does speed up
          # the cross build whenever the esp-devtool binary cache misses.
          save-if: ${{ inputs.branch != '' }}

      # xtask runs on the AArch64 HIL runners as a host tool.
      # We build the actual tests separately using the correct toolchain.
      # Cache the cross-compiled binary, it rarely changes so this avoids the
      # expensive cross build.
      - name: Cache xtask binary
        id: xtask-cache
        uses: actions/cache@v6
        with:
          path: target/aarch64-unknown-linux-gnu/release/esp-devtool
          key: xtask-hil-aarch64-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'xtask/**', 'xtask-mcp-macros/**') }}

      - name: Install host toolchain for cross-compiling xtask
        if: steps.xtask-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu

      - uses: taiki-e/install-action@v2
        if: steps.xtask-cache.outputs.cache-hit != 'true'
        with:
          tool: cross

      - name: Build xtask for HIL runners
        if: steps.xtask-cache.outputs.cache-hit != 'true'
        run: cross build --release --target aarch64-unknown-linux-gnu -p esp-devtool

      - name: Upload xtask artifact
        uses: actions/upload-artifact@v6
        with:
          name: xtask-aarch64
          path: target/aarch64-unknown-linux-gnu/release/esp-devtool
          if-no-files-found: error

  hil-run:
    needs: [build, devtool]
    if: ${{ inputs.package != 'hil-test-radio' }}
    # When called from ci.yml, hil-gate below decides the verdict from the ≥50%
    # rule, so a single flaky runner must not fail the run and with it the
    # caller's job.
    continue-on-error: ${{ inputs.branch == '' }}
    runs-on:
      labels: [self-hosted, "${{ matrix.target.runner }}"]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hil-tests
          path: tests/
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: xtask-${{ matrix.target.host }}

      - name: Skip if this target wasn't built
        id: guard
        run: |
          if [ ! -d "tests/${{ matrix.target.soc }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No tests for ${{ matrix.target.soc }} in this run; skipping."
          fi

      - name: Run Tests
        if: steps.guard.outputs.skip != 'true'
        id: run-tests
        env:
          SOC: ${{ matrix.target.soc }}
          TESTS: ${{ inputs.tests }}
        run: |
          [ -f ~/setup.sh ] && source ~/setup.sh

          export PATH=$PATH:/home/espressif/.cargo/bin
          chmod +x esp-devtool

          # An array keeps the flag off the command line entirely when no
          # filter was asked for, without word-splitting the value itself.
          FILTER=()
          if [ -n "$TESTS" ]; then
            FILTER=(--filter "$TESTS")
          fi

          ./esp-devtool run elfs "$SOC" "tests/$SOC" "${FILTER[@]}"

      - name: Clean up
        if: always()
        run: |
          rm -rf tests/ || true
          rm -f esp-devtool || true

  # Radio HIL device runs (hil-test-radio) — wifi/BT capable chips on dedicated
  # radio runners.  The matrix is empty when no requested chip has a radio
  # runner, which causes this job to be skipped entirely.
  hil-run-radio:
    needs: [build, devtool]
    if: >
      inputs.package != 'hil-test' &&
      needs.build.outputs.has_radio == 'true'
    continue-on-error: ${{ inputs.branch == '' }}
    runs-on:
      labels: [self-hosted, "${{ matrix.target.runner }}"]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.radio_matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hil-tests-radio
          path: tests/
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: xtask-${{ matrix.target.host }}

      - name: Skip if this target wasn't built
        id: guard
        run: |
          if [ ! -d "tests/${{ matrix.target.soc }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No radio tests for ${{ matrix.target.soc }} in this run; skipping."
          fi

      - name: Reset ESP USB-JTAG devices
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 1
        shell: bash
        run: |
          # The support firmware runs forever on the harness probe; a previous
          # run can leave the in-chip USB-Serial-JTAG bridge wedged so the next
          # flash hangs. Issue USBDEVFS_RESET to force a clean re-enumeration.
          python3 - <<'PY'
          import fcntl, glob, os, time
          USBDEVFS_RESET = (ord('U') << 8) | 20  # _IO('U', 20)
          reset_any = False
          for dev in glob.glob('/sys/bus/usb/devices/*'):
              try:
                  vid = open(os.path.join(dev, 'idVendor')).read().strip().lower()
                  pid = open(os.path.join(dev, 'idProduct')).read().strip().lower()
              except OSError:
                  continue
              if (vid, pid) != ('303a', '1001'):
                  continue
              busnum = int(open(os.path.join(dev, 'busnum')).read())
              devnum = int(open(os.path.join(dev, 'devnum')).read())
              node = f'/dev/bus/usb/{busnum:03d}/{devnum:03d}'
              try:
                  with open(node, 'wb') as f:
                      fcntl.ioctl(f, USBDEVFS_RESET, 0)
                  print(f'reset {node} ({vid}:{pid})')
                  reset_any = True
              except OSError as e:
                  print(f'failed to reset {node}: {e}')
          if reset_any:
              time.sleep(2)  # allow udev to re-enumerate before probe-rs runs
          PY

      - name: Run Radio Tests
        if: steps.guard.outputs.skip != 'true'
        id: run-tests
        timeout-minutes: 3
        env:
          SOC: ${{ matrix.target.soc }}
          TESTS: ${{ inputs.tests }}
        run: |
          [ -f ~/setup.sh ] && source ~/setup.sh

          export PATH=$PATH:/home/espressif/.cargo/bin
          chmod +x esp-devtool

          FILTER=()
          if [ -n "$TESTS" ]; then
            FILTER=(--filter "$TESTS")
          fi

          ./esp-devtool run elfs "$SOC" "tests/$SOC" "${FILTER[@]}"

      - name: Clean up
        if: always()
        run: |
          rm -rf tests/ || true
          rm -f esp-devtool || true

  # Merge gate for hil-run matrix legs.  Blocks when ≥50% of legs that actually
  # ran tests failed or were cancelled.  Skipped legs (no ELFs for that chip)
  # are excluded.  hil-run-radio is not part of this gate.
  hil-gate:
    needs: [build, hil-run]
    if: >
      always() &&
      inputs.branch == '' &&
      needs.build.result == 'success' &&
      needs.hil-run.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Evaluate hil-run results
        uses: actions/github-script@v7
        with:
          script: |
            const { evaluateHilGate } = require('./.github/scripts/hil-gate.js');
            await evaluateHilGate({ github, context, core });
