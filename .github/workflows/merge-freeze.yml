# Starts and lifts the repository-wide merge freeze.
#
# `freeze` pins the freeze issue that `merge-freeze-gate` reads. Re-running it
# during a freeze updates that issue, which is how the settings are adjusted.

name: Merge freeze

run-name: >-
  ${{ inputs.state == 'thaw' && 'Lift merge freeze'
      || format('Start merge freeze{0}', inputs.version != '' && format(' (pre-{0})', inputs.version) || '') }}

on:
  workflow_dispatch:
    inputs:
      state:
        description: "Start or lift the freeze"
        required: true
        type: choice
        options: [freeze, thaw]
        default: freeze
      version:
        description: "Release this freeze leads up to, e.g. 1.2.0"
        required: false
        type: string
        default: ""
      reason:
        description: "Shown to everyone whose pull request is blocked"
        required: false
        type: string
        default: "pre-release merge freeze"
      scope:
        description: "Base branches to freeze (space or comma separated)"
        required: false
        type: string
        default: "main"
      min_approvals:
        description: "Approvals required to merge an exempted pull request"
        required: false
        type: number
        default: 2

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  cancel-in-progress: false
  group: merge-freeze

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/github-script@v8
        with:
          script: |
            const { run } = require('./.github/scripts/merge-freeze.js');
            await run({
              github,
              context,
              core,
              state: process.env.FREEZE_STATE,
              version: process.env.FREEZE_VERSION,
              reason: process.env.FREEZE_REASON,
              scope: process.env.FREEZE_SCOPE,
              minApprovals: process.env.FREEZE_MIN_APPROVALS,
            });
        env:
          FREEZE_STATE: ${{ inputs.state }}
          FREEZE_VERSION: ${{ inputs.version }}
          FREEZE_REASON: ${{ inputs.reason }}
          FREEZE_SCOPE: ${{ inputs.scope }}
          FREEZE_MIN_APPROVALS: ${{ inputs.min_approvals }}
