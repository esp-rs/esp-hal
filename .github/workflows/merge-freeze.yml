# Starts and lifts the repository-wide merge freeze.
#
# `freeze` pins the freeze issue that `merge-freeze-gate` reads; open pull
# requests are not touched.

name: Merge freeze

run-name: >-
  ${{ inputs.state == 'thaw' && 'Lift merge freeze'
      || format('Start merge freeze{0}', inputs.version != '' && format(' (pre-{0})', inputs.version) || '') }}

on:
  workflow_dispatch:
    inputs:
      state:
        description: "Start or lift the freeze"
        required: true
        type: choice
        options: [freeze, thaw]
        default: freeze
      version:
        description: "Release this freeze leads up to, e.g. 1.2.0"
        required: false
        type: string
        default: ""
      reason:
        description: "Shown to everyone whose merge is blocked"
        required: false
        type: string
        default: "pre-release merge freeze"

permissions:
  contents: read
  issues: write

concurrency:
  cancel-in-progress: false
  group: merge-freeze

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/github-script@v8
        with:
          script: |
            const { toggle } = require('./.github/scripts/merge-freeze.js');
            await toggle({
              github,
              context,
              core,
              state: process.env.FREEZE_STATE,
              version: process.env.FREEZE_VERSION,
              reason: process.env.FREEZE_REASON,
            });
        env:
          FREEZE_STATE: ${{ inputs.state }}
          FREEZE_VERSION: ${{ inputs.version }}
          FREEZE_REASON: ${{ inputs.reason }}
