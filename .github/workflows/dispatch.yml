name: Dispatch

on:
  # labels on PRs
  pull_request_target:
    types: [labeled]
  # slash commands & trust commands
  issue_comment:
    types: [created, edited]

permissions:
  actions: write
  pull-requests: write
  contents: read

# Unique marker correlating a dispatched run with this dispatcher invocation.
# The dispatch step and its matching find-run step MUST use the same value, so
# define it once here rather than repeating the expression at every call site.
env:
  DISTINCT_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # ---------------------------------------------------------------------------
  # LABEL: TRUSTED AUTHOR
  # ---------------------------------------------------------------------------
  label-trusted-author:
    if: github.event_name == 'pull_request_target' &&
      github.event.label.name == 'trusted-author'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Get PR author login
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const login = (context.payload.pull_request.user.login || '').toLowerCase();
            if (!login) {
              core.setFailed('Could not determine PR author login');
              return;
            }
            core.setOutput('login', login);

      - id: find
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "[HIL trust list]"

      - name: Upsert trust list for author
        id: upsert
        uses: actions/github-script@v7
        with:
          script: |
            const { upsertTrusted } = require('./.github/scripts/hil-trust.js');
            const existing = `${{ toJson(steps.find.outputs.comment-body || '') }}`;
            const login = '${{ steps.pr.outputs.login }}'.toLowerCase();

            const { body } = upsertTrusted(existing, login);
            core.setOutput('body', body);

      - uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          body: ${{ steps.upsert.outputs.body }}
          edit-mode: replace

      - uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Author **@${{ steps.pr.outputs.login }}** was trusted for this PR via the `trusted-author` label.
            They can now use `/test` (`quick`, `full`, or chips and test names). `/hil` still works too.

  # ---------------------------------------------------------------------------
  # TRUST MANAGEMENT (/trust, /revoke)
  # ---------------------------------------------------------------------------

  trust:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER') &&
      startsWith(github.event.comment.body, '/trust ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Parse login
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const { parseTrustCommand } = require('./.github/scripts/hil-trust.js');
            const res = parseTrustCommand(context.payload.comment.body, 'trust');
            if (res.error) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: res.error,
              });
              core.setFailed(res.error);
            }
            core.setOutput('login', res.login);

      - id: find
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment-author: github-actions[bot]
          body-includes: "[HIL trust list]"

      - name: Upsert trust list
        id: upsert
        uses: actions/github-script@v7
        with:
          script: |
            const { upsertTrusted } = require('./.github/scripts/hil-trust.js');
            const existing = `${{ toJson(steps.find.outputs.comment-body || '') }}`;
            const login = '${{ steps.parse.outputs.login }}'.toLowerCase();

            const { body } = upsertTrusted(existing, login);
            core.setOutput('body', body);

      - uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          body: ${{ steps.upsert.outputs.body }}
          edit-mode: replace

      - uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          # separate short confirmation comment
          body: "Trusted **@${{ steps.parse.outputs.login }}** for this PR. They can now use `/test` (`quick`, `full`, or chips and test names). `/hil` still works too."

  revoke:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER') &&
      startsWith(github.event.comment.body, '/revoke ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Parse login
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const { parseTrustCommand } = require('./.github/scripts/hil-trust.js');
            const res = parseTrustCommand(context.payload.comment.body, 'revoke');
            if (res.error) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: res.error,
              });
              core.setFailed(res.error);
            }
            core.setOutput('login', res.login);

      - id: find
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment-author: github-actions[bot]
          body-includes: "[HIL trust list]"

      - name: Remove from trust list
        id: update
        uses: actions/github-script@v7
        with:
          script: |
            const { revokeTrusted } = require('./.github/scripts/hil-trust.js');
            const existing = `${{ toJson(steps.find.outputs.comment-body || '') }}`;
            const login = '${{ steps.parse.outputs.login }}'.toLowerCase();

            const { body } = revokeTrusted(existing, login);
            core.setOutput('body', body);

      - uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          body: ${{ steps.update.outputs.body }}
          edit-mode: replace

      - uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "Revoked **@${{ steps.parse.outputs.login }}** for this PR."

  # ---------------------------------------------------------------------------
  # SLASH-BASED DISPATCHES (/test quick, /test full, /test <chip> <test>, and the previous /hil spelling)
  # ---------------------------------------------------------------------------

  auth:
    # Only PR comments need auth
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const assoc = context.payload.comment.author_association;
            const commenter = context.payload.comment.user.login.toLowerCase();
            const pr = context.payload.issue.number;

            if (assoc === 'MEMBER' || assoc === 'OWNER') {
              core.setOutput('allowed', 'true');
              return;
            }

            const { owner, repo } = context.repo;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pr, per_page: 100 }
            );
            const trust = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              typeof c.body === 'string' &&
              c.body.includes('HIL_TRUST_JSON')
            );

            let allowed = false;
            if (trust) {
              const m = trust.body.match(/<!--\s*HIL_TRUST_JSON\s*([\s\S]*?)\s*HIL_TRUST_JSON\s*-->/);
              if (m && m[1]) {
                try {
                  const data = JSON.parse(m[1]);
                  const list = (data.trusted || []).map(s => String(s).toLowerCase());
                  allowed = list.includes(commenter);
                } catch {}
              }
            }
            core.setOutput('allowed', allowed ? 'true' : 'false');

  hil:
    needs: auth
    if: github.event_name == 'issue_comment' &&
      needs.auth.outputs.allowed == 'true' &&
      (startsWith(github.event.comment.body, '/hil ') ||
      startsWith(github.event.comment.body, '/test '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # for `require`
        with:
          fetch-depth: 1

      - name: Resolve dispatch parameters
        id: mode
        uses: actions/github-script@v7
        with:
          # A command that can't be run is answered by `hil-help`.
          script: |
            const { parseHilCommand } = require('./.github/scripts/hil-parse.js');
            const res = parseHilCommand(context.payload.comment.body) || {};

            core.setOutput('selector', res.selector || '');
            core.setOutput('chips', res.chips || '');
            core.setOutput('tests', res.tests || '');
            core.setOutput('package', res.package || '');

      - name: Dispatch HIL
        if: steps.mode.outputs.chips != ''
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: hil.yml
          ref: ${{ github.event.repository.default_branch }}
          inputs: |
            {
              "repository": "${{ github.repository }}",
              "branch": "refs/pull/${{ github.event.issue.number }}/head",
              "pr_number": "${{ github.event.issue.number }}",
              "chips": "${{ steps.mode.outputs.chips }}",
              "tests": "${{ steps.mode.outputs.tests }}",
              "package": "${{ steps.mode.outputs.package }}",
              "distinct_id": "${{ env.DISTINCT_ID }}"
            }

      - name: Find HIL run URL
        if: steps.mode.outputs.chips != ''
        id: find-run
        uses: actions/github-script@v7
        with:
          script: |
            const { findHilRun } = require('./.github/scripts/hil-find-run.js');

            const { body } = await findHilRun({
              github,
              context,
              pr: context.payload.issue.number,
              selector: '${{ steps.mode.outputs.selector }}',
              tests: '${{ steps.mode.outputs.tests }}',
              pkg: '${{ steps.mode.outputs.package }}',
              distinctId: '${{ env.DISTINCT_ID }}',
            });

            core.setOutput('body', body);

      - name: Confirm in PR
        if: steps.mode.outputs.chips != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: ${{ steps.find-run.outputs.body }}

  hil-deny:
    needs: auth
    if:
      github.event_name == 'issue_comment' && needs.auth.outputs.allowed != 'true' &&
      (startsWith(github.event.comment.body, '/hil ') ||
      startsWith(github.event.comment.body, '/test ') ||
      startsWith(github.event.comment.body, '/test-size'))
    runs-on: ubuntu-latest
    steps:
      - name: Inform not allowed
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            @${{ github.event.comment.user.login }}, sorry — you're not allowed to execute HIL runs or binary size analysis for this PR.
            Please ask an `esp-rs` member/owner to grant access with:
            ```
            /trust @${{ github.event.comment.user.login }}
            ```
            After that, you can use `/test` (`quick`, `full`, or chips and test names; `/hil` still works) or `/test-size`.

  hil-help:
    if: github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/hil') ||
      startsWith(github.event.comment.body, '/test')) &&
      !startsWith(github.event.comment.body, '/test-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # for `require`
        with:
          fetch-depth: 1

      - name: Explain usage
        uses: actions/github-script@v7
        with:
          script: |
            const { parseHilCommand, USAGE } = require('./.github/scripts/hil-parse.js');
            const res = parseHilCommand(context.payload.comment.body);
            if (!res || (!res.help && !res.error)) return;

            const login = context.payload.comment.user.login;
            const problem = res.error ? `@${login}, this command can't be run:\n${res.error}\n\n` : '';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: problem + USAGE,
            });

  binary-size:
    needs: auth
    if: github.event_name == 'issue_comment' &&
      needs.auth.outputs.allowed == 'true' &&
      startsWith(github.event.comment.body, '/test-size')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # for `require`
        with:
          fetch-depth: 1

      - name: Extract parameters from comment
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const { parseTestSizeCommand, USAGE } = require('./.github/scripts/hil-parse.js');
            const res = parseTestSizeCommand(context.payload.comment.body);
            if (!res || res.error) {
              const login = context.payload.comment.user.login;
              const error = res?.error || 'Write the command as `/test-size` followed by its words.';
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `@${login}, this \`/test-size\` command can't be run:\n${error}\n\n${USAGE}`,
              });
              core.setFailed(error);
              return;
            }

            // `example_name` takes several examples, separated by spaces.
            const chips = JSON.stringify(res.chips);
            core.setOutput('example_name', res.examples);
            core.setOutput('package', res.package);
            core.setOutput('chips', chips);
            core.setOutput('chips_escaped', JSON.stringify(chips).slice(1, -1));
            core.info(`Parsed — examples: ${res.examples} | package: ${res.package} | chips: ${chips}`);

      - name: Confirm in PR
        id: comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: >
            Triggered binary size analysis for
            `${{ steps.extract.outputs.example_name }}`
            on chips `${{ steps.extract.outputs.chips }}`
            for #${{ github.event.issue.number }}.
            Results will be posted as a comment when ready.

      - name: Dispatch Binary Size Analysis
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: binary-size.yml
          ref: ${{ github.event.repository.default_branch }}
          inputs: '{"pr_number":"${{ github.event.issue.number }}","comment_id":"${{ steps.comment.outputs.comment-id }}","example_name":"${{ steps.extract.outputs.example_name }}","package":"${{ steps.extract.outputs.package }}","chips":"${{ steps.extract.outputs.chips_escaped }}","distinct_id":"${{ env.DISTINCT_ID }}"}'

      - name: Find binary size run URL
        id: find-run
        uses: actions/github-script@v7
        with:
          script: |
            const { findDispatchedRun } = require('./.github/scripts/hil-find-run.js');

            const run = await findDispatchedRun({
              github,
              context,
              workflowId: 'binary-size.yml',
              distinctId: '${{ env.DISTINCT_ID }}',
            });

            core.setOutput('url', run?.html_url || '');

      - name: Add run URL to comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.comment.outputs.comment-id }}
          body: >
            Triggered **binary size analysis** for #${{ github.event.issue.number }}
            (example: `${{ steps.extract.outputs.example_name }}`, chips: `${{ steps.extract.outputs.chips }}`).

            Run: ${{ steps.find-run.outputs.url != '' && steps.find-run.outputs.url || 'could not be determined yet; check the Binary Size Analysis workflow runs manually.' }}
          edit-mode: replace
