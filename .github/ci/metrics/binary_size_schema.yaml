title: esp-hal Binary Size Metrics
type: object
properties:
  binary_size:
    type: object
    title: Binary Size Totals
    description: Total flash and RAM sizes per chip and example.
    properties:
      data:
        type: array
        minItems: 1
        items:
          type: object
          properties:
            chip:
              type: string
              title: Chip
              description: Target SoC identifier (InfluxDB tag).
            example:
              type: string
              title: Example
              description: Example binary name (InfluxDB tag).
            flash:
              type: integer
              title: Flash size
              description: Total flash usage in bytes.
              unit: bytes
            ram:
              type: integer
              title: RAM size
              description: Total static RAM usage in bytes, including data and code copied from flash.
              unit: bytes
          required:
            - chip
            - example
            - flash
            - ram
          additionalProperties: false
    required:
      - data
    additionalProperties: false

  binary_size_sections:
    type: object
    title: Binary Size Sections
    description: Per-ELF-section size breakdown per chip and example.
    properties:
      data:
        type: array
        minItems: 1
        items:
          type: object
          properties:
            chip:
              type: string
              title: Chip
              description: Target SoC identifier (InfluxDB tag).
            example:
              type: string
              title: Example
              description: Example binary name (InfluxDB tag).
            section:
              type: string
              title: ELF section
              description: ELF section name, e.g. .text, .rodata, .bss (InfluxDB tag).
            kind:
              type: string
              title: Memory kind
              description: >-
                Where the section lives: flash, ram (copied from flash into RAM at boot)
                or bss (RAM only) (InfluxDB tag).
            bytes:
              type: integer
              title: Section size
              description: Section size in bytes.
              unit: bytes
          required:
            - chip
            - example
            - section
            - kind
            - bytes
          additionalProperties: false
    required:
      - data
    additionalProperties: false

required:
  - binary_size
  - binary_size_sections
additionalProperties: false
