# The esp-generate template manifest.
#
# This template is the esp-generate default template, adapted to build against
# this commit of esp-hal instead of the released crates. Use it to reproduce
# issues: `esp-generate --template <path-to-esp-hal>/template` (or the git URL
# of this repository) generates a project whose esp-hal crates come from this
# checkout (or, for a clone, from the exact commit it was generated from).
#
# This file decides *which* files a generated project gets; `template.yaml` (the
# option tree, read by the SDK) decides what is *in* them.

# The `esp-template-sdk` version this template is written against. The binary
# refuses a template outside its compatibility range.
sdk_version = "0.1.0"

name = "esp-hal"
description = "no_std applications built against this commit of esp-hal"

# `chip` supplies the chip selection group (`!Include plugin:chip`) and every
# `chip.…` fact.
plugins = { chip = "0.5.0" }

# Files whose emission is conditional, or whose output path differs from their
# source path. Anything not listed here is emitted as-is; anything under
# `.template/` is never emitted at all, which is where partials and the option
# tree's `!Include` fragments live.
emit = [
  # Renamed in the repository, where cargo, rustup and git would otherwise read
  # them with their placeholders unrendered.
  { path = "Cargo.toml.in",                 as = "Cargo.toml" },
  { path = "rust-toolchain.toml.in",        as = "rust-toolchain.toml" },
  { path = ".cargo/config.toml.in",         as = ".cargo/config.toml" },
  { path = ".gitignore.in",                 as = ".gitignore" },

  { path = "tests/hello_test.rs",           when = 'option("embedded-test")' },
]
